services:
  # ------------------------------
  # Etcd：元数据存储（稳定）
  # ------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: milvus-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus-data/etcd:/etcd-data
    command: etcd --name=etcd-1 --data-dir=/etcd-data --listen-client-urls=http://0.0.0.0:2379 --advertise-client-urls=http://etcd:2379 --listen-peer-urls=http://0.0.0.0:2380 --initial-advertise-peer-urls=http://etcd:2380 --initial-cluster=etcd-1=http://etcd:2380
    networks:
      - milvus-network

  # ------------------------------
  # MinIO：向量存储（已修复）
  # ------------------------------
  minio:
    image: minio/minio:RELEASE.2023-08-04T17-40-21Z
    container_name: milvus-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./milvus-data/minio:/data
    command: server /data
    networks:
      - milvus-network

  # ------------------------------
  # Milvus 核心服务（修复 Tini 命令问题）
  # ------------------------------
  milvus-standalone:
    image: milvusdb/milvus:v2.4.8
    container_name: milvus-standalone
    restart: always
    depends_on:
      - etcd
      - minio
    environment:
      - MILVUS_LOG_LEVEL=info
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - GOMAXPROCS=4
      - MEMORY_LIMIT=4GB
    volumes:
      - ./milvus-data/milvus:/var/lib/milvus
    # 关键：直接指定 Milvus 启动二进制文件，绕开 Tini 解析
    command: /milvus/bin/milvus run standalone
    networks:
      - milvus-network
    ports:
      - "19530:19530"  # 客户端连接端口
      - "9091:9091"    # HTTP 监控端口

  # ------------------------------
  # Attu：可视化管理界面（确保连接）
  # ------------------------------
  attu:
    image: zilliz/attu:v2.4.5
    container_name: milvus-attu
    restart: always
    depends_on:
      - milvus-standalone
    environment:
      - MILVUS_URL=milvus-standalone:19530  # 同网络服务名直接访问
    networks:
      - milvus-network
    ports:
      - "8000:3000"

  # ------------------------------
  # Nebula Meta 服务：元数据管理
  # ------------------------------
  nebula-metad:
    image: vesoft/nebula-metad:v3.6.0
    container_name: nebula-metad
    restart: always
    environment:
      - USER=root
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
    volumes:
      - ./nebula-data/meta:/data/meta
      - ./nebula-data/logs/meta:/logs
    networks:
      - milvus-network
    ports:
      - "9559:9559"
      - "19559:19559"
      - "19560:19560"

  # ------------------------------
  # Nebula Storage 服务：数据存储
  # ------------------------------
  nebula-storaged:
    image: vesoft/nebula-storaged:v3.6.0
    container_name: nebula-storaged
    restart: always
    depends_on:
      - nebula-metad
    environment:
      - USER=root
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
    volumes:
      - ./nebula-data/storage:/data/storage
      - ./nebula-data/logs/storage:/logs
    networks:
      - milvus-network
    ports:
      - "9779:9779"
      - "19779:19779"
      - "19780:19780"

  # ------------------------------
  # Nebula Graph 服务：查询服务
  # ------------------------------
  nebula-graphd:
    image: vesoft/nebula-graphd:v3.6.0
    container_name: nebula-graphd
    restart: always
    depends_on:
      - nebula-metad
      - nebula-storaged
    environment:
      - USER=root
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
      - --log_dir=/logs
      - --v=0
    volumes:
      - ./nebula-data/logs/graph:/logs
    networks:
      - milvus-network
    ports:
      - "9669:9669"  # 客户端连接端口（nGQL）
      - "19669:19669"  # HTTP 端口
      - "19670:19670"  # HTTP2 端口

  # ------------------------------
  # Nebula Studio：可视化平台
  # ------------------------------
  nebula-studio:
    image: vesoft/nebula-graph-studio:v3.2.2
    container_name: nebula-studio
    restart: always
    depends_on:
      - nebula-graphd
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=7001
    networks:
      - milvus-network
    ports:
      - "7001:7001"  # Studio Web 界面

# ------------------------------
# 统一网络：确保所有服务互通
# ------------------------------
networks:
  milvus-network:
    driver: bridge